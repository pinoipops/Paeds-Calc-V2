<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Medical Cross -->
  <g filter="url(#shadow)">
    <!-- Vertical bar -->
    <rect x="216" y="116" width="80" height="280" rx="20" fill="#ffffff"/>
    <!-- Horizontal bar -->
    <rect x="116" y="216" width="280" height="80" rx="20" fill="#ffffff"/>
  </g>
  
  <!-- Inner Subtle Stethoscope / Pulse Accent -->
  <circle cx="256" cy="256" r="28" fill="#2563eb"/>
  <path d="M246 256h20" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
</svg>
