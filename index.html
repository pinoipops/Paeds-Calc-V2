<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Paeds Calc</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<main class="app">

  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">✚</div>
      <div>
        <h1>Paeds Calc</h1>
        <p>Pediatric Dose Calculator</p>
      </div>
    </div>

    <button class="favourite-toggle" id="favouriteToggle" type="button">
      <span>☆</span>
      <span>Favourites</span>
    </button>
  </header>

  <section class="shortcuts">
    <h2>QUICK SHORTCUTS</h2>
    <div class="shortcut-grid" id="shortcutGrid"></div>
  </section>

  <section class="calculator-card">

    <div class="field" id="weightField">
      <label for="weight">PATIENT WEIGHT (KG)</label>
      <div class="input-wrap">
        <span class="field-icon">⚖</span>
        <input id="weight" type="number" min="0.1" step="0.1"
               inputmode="decimal" placeholder="20" autocomplete="off">
        <span class="unit">kg</span>
      </div>
    </div>

    <div class="field age-field hidden" id="ageField">
      <label for="age">PATIENT AGE</label>
      <div class="input-wrap">
        <span class="field-icon">◷</span>
        <input id="age" type="number" min="0" step="0.1"
               inputmode="decimal" placeholder="4" autocomplete="off">
        <span class="unit">years</span>
      </div>
      <small class="field-help" id="ageHelp"></small>
    </div>

    <div class="field">
      <label for="medication">MEDICATION</label>
      <div style="display: flex; gap: 12px; align-items: center;">
        <div class="select-wrap" style="flex-grow: 1;">
          <span class="field-icon">◒</span>
          <select id="medication"></select>
        </div>
        <button id="globalFavouriteBtn" class="star-btn" type="button" aria-label="Toggle favourite" style="height: 68px; width: 68px; flex: 0 0 68px; border: 1.5px solid #d2d9e6; border-radius: 12px; background: #fff; font-size: 30px; cursor: pointer; display: grid; place-items: center;">☆</button>
      </div>
    </div>

    <div class="field">
      <label for="concentration">CONCENTRATION</label>
      <div class="select-wrap">
        <span class="field-icon">▱</span>
        <select id="concentration"></select>
      </div>
    </div>

    <div class="field">
      <label for="regimen">DOSING REGIMEN</label>
      <div class="select-wrap">
        <span class="field-icon">▣</span>
        <select id="regimen"></select>
      </div>
    </div>

    <button class="calculate-btn" id="calculate" type="button">
      <span>▦</span> CALCULATE DOSE
    </button>

  </section>

  <section class="result-card hidden" id="resultCard">
    <div class="result-title">
      <span class="result-icon">✓</span>
      <span>DOSE CALCULATION</span>
    </div>

    <div class="result-main">
      <div class="dose-block">
        <span class="result-label">DOSE PER DOSE</span>
        <strong id="doseValue">—</strong>
        <span id="volumeValue">—</span>
      </div>

      <div class="result-divider"></div>

      <div class="dose-block">
        <span class="result-label">FREQUENCY</span>
        <strong class="frequency" id="frequencyValue">—</strong>
        <span id="frequencySub"></span>
      </div>
    </div>

    <div class="calculation-box">
      <strong>Calculation</strong>
      <div id="calculationText"></div>
    </div>
  </section>

  <section class="note-card hidden" id="noteCard">
    <div class="note-icon">i</div>
    <div>
      <strong>Important</strong>
      <ul id="noteList"></ul>
    </div>
  </section>

  <section class="favourites-card hidden" id="favouritesCard">
    <div class="favourites-header">
      <div>
        <h2>Favourites</h2>
        <p>Tap a medication to open it.</p>
      </div>
      <button id="closeFavourites" type="button">×</button>
    </div>
    <div id="favouritesList"></div>
  </section>

  <footer>
    <strong>Paeds Calc • V4</strong>
    <span>Clinical dosing reference tool</span>
  </footer>

</main>

<script src="script.js"></script>
</body>
</html>
